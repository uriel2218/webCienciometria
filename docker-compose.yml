version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: c4_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: c4_db
      MYSQL_USER: c4_user
      MYSQL_PASSWORD: c4_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    # NOTA: No exponemos el puerto 3306 al host para evitar accesos externos directos.
    # Solo los contenedores dentro de 'backend-network' pueden acceder.

  backend:
    build: ./backend
    container_name: c4_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://c4_user:c4_password@db:3306/c4_db
      - SECRET_KEY=supersecretkey_change_in_production_9f8g7h6
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - db
    networks:
      - backend-network

  frontend:
    build: ./frontend
    container_name: c4_angular
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:

